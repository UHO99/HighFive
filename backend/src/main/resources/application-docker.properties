spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/highfive?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&rewriteBatchedStatements=true&allowLoadLocalInfile=true

# session persistence
server.servlet.session.persistent=false

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Tomcat
server.tomcat.threads.max=1000
server.tomcat.accept-count=2000
server.tomcat.max-connections=20000

# K6 부하테스트 (K6TestService) - docker-compose.yml의 highfive-net / highfive-k6 이미지와 짝을 이룬다.
app.k6.network=highfive-net
app.k6.image=highfive-k6:latest
app.k6.base-url=http://backend:8080
