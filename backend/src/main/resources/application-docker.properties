spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql:3306/highfive?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&rewriteBatchedStatements=true&allowLoadLocalInfile=true

# HikariCP - \uAE30\uBCF8\uAC12(10)\uC740 burst \uC870\uAC74(\uBD80\uD558 \uD14C\uC2A4\uD2B8)\uC5D0\uC11C \uBCD1\uBAA9\uC774 \uD655\uC778\uB428.
# validateIssueable() DB \uC870\uD68C \uC790\uCCB4\uB97C \uC5C6\uC560\uB294 \uADFC\uBCF8 \uAC1C\uC120(B1)\uC740 \uBCC4\uB3C4\uB85C \uC9C4\uD589\uD558\uAE30\uB85C \uD558\uACE0,
# \uC6B0\uC120 \uD480 \uD06C\uAE30\uB9CC \uB298\uB824 \uC644\uD654\uD55C\uB2E4.
spring.datasource.hikari.maximum-pool-size=50

# session persistence
server.servlet.session.persistent=false

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Redis
spring.data.redis.host=redis
spring.data.redis.port=6379

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Tomcat
server.tomcat.threads.max=2000
server.tomcat.accept-count=4000
server.tomcat.max-connections=50000

# K6 \uBD80\uD558\uD14C\uC2A4\uD2B8 (K6TestService) - docker-compose.yml\uC758 highfive-net / highfive-k6 \uC774\uBBF8\uC9C0\uC640 \uC9DD\uC744 \uC774\uB8EC\uB2E4.
app.k6.network=highfive-net
app.k6.image=highfive-k6:latest
app.k6.base-url=http://backend:8080