spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# STS 로컬 실행용 — 로컬 MySQL (기본 3306). Docker MySQL을 쓸 땐 application-docker.properties
spring.datasource.url=jdbc:mysql://localhost:3306/highfive?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Seoul&rewriteBatchedStatements=true&allowLoadLocalInfile=true
spring.datasource.username=ureca
spring.datasource.password=ureca

# session persistence
server.servlet.session.persistent=false

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN

# Redis — 로컬 Redis 또는 docker compose redis만 올린 경우
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Tomcat
server.tomcat.threads.max=1000
server.tomcat.accept-count=2000
server.tomcat.max-connections=20000

# K6 (로컬 STS에서는 대시보드 k6 버튼이 Docker 소켓 필요할 수 있음 — 평소 개발엔 불필요)
app.k6.network=highfive-net
app.k6.image=highfive-k6:latest
app.k6.base-url=http://localhost:8080
